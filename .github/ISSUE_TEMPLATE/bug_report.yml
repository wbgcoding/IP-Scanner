name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Security problems belong in a private report, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: IP-Scanner version
      placeholder: "2.11"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2, x64"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: |
        Screenshots or lines from `error.log` help. Please remove IP addresses, MAC addresses and device names you consider private before posting.
